name: CPU checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install hardware and assembly tools
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys clang lld
      - run: make lint test check-asm synth
